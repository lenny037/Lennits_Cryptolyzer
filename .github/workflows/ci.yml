name: CI

# ADR-0011: CI is a Phase 0.5 gate, not a Phase 19 activity. Every gate below must be able to
# fail. A pipeline that cannot fail is decoration.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core build and test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and run architecture guards
        run: ./gradlew verifyAll --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/*/build/reports/tests/test
            core/*/build/test-results/test
          retention-days: 14
          if-no-files-found: warn

  guards:
    name: Architecture and dependency guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v4

      - name: Firebase and Firestore exclusion guard
        run: ./scripts/firebase-guard.sh

      - name: Floating-point-in-money guard
        run: ./scripts/float-guard.sh

      - name: Reject committed binary archives
        # The repository previously carried ~79 MB of split zip archives on the default branch.
        # See docs/migration/DELETION_MANIFEST.md.
        run: |
          set -euo pipefail
          if found=$(git ls-files \
              | grep -v '^gradle/wrapper/gradle-wrapper.jar$' \
              | grep -iE '\.(zip|zip\.[0-9]{3}|7z|rar|jar|aar|apk|aab|so|dylib|dll)$' || true); then
            if [ -n "$found" ]; then
              echo "VIOLATION: binary artifacts are tracked in git:" >&2
              echo "$found" >&2
              exit 1
            fi
          fi
          echo "No tracked binary archives."

      - name: Reject oversized tracked files
        run: |
          set -euo pipefail
          limit=$((2 * 1024 * 1024))
          oversized=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file")
            if [ "$size" -gt "$limit" ]; then
              echo "VIOLATION: $file is $size bytes, over the 2 MiB limit" >&2
              oversized=1
            fi
          done < <(git ls-files)
          [ "$oversized" -eq 0 ] || exit 1
          echo "No oversized tracked files."

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject obvious credential material in tracked files
        # A cheap, dependency-free backstop that runs even if the action above is unavailable.
        run: |
          set -euo pipefail
          patterns='PRIVATE KEY-----|BEGIN OPENSSH PRIVATE|xoxb-[0-9A-Za-z-]{10,}|ghp_[0-9A-Za-z]{30,}|AKIA[0-9A-Z]{16}'
          if git grep -nIE "$patterns" -- . ':!docs' ':!legacy' ':!.github/workflows/ci.yml'; then
            echo "VIOLATION: possible credential material committed" >&2
            exit 1
          fi
          echo "No obvious credential material in tracked files."

  # The Android job is intentionally absent until :android:app exists (PLAN_V2 Phase 4). Adding a
  # job that builds nothing would report a green gate for work that has not been done.
