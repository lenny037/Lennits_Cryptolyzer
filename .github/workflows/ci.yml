name: CI

# ADR-0011: CI is a Phase 0.5 gate, not a Phase 19 activity. Every gate below must be able to
# fail. A pipeline that cannot fail is decoration.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core build and test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and run architecture guards
        run: ./gradlew verifyAll --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/*/build/reports/tests/test
            core/*/build/test-results/test
          retention-days: 14
          if-no-files-found: warn

