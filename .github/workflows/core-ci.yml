name: Core CI
on: [push, pull_request]
jobs:
  core:
    name: Core build and test (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew verifyAll --no-daemon --stacktrace
